name: Verify V2

on:
  pull_request:
    branches:
      - main
      - design/gpt-taste-redesign

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax checks
        run: |
          node --check app.js
          node --check model.js
          node --check network-renderer.js
          node --check scene-content.js
          node --check scroll-scenes.js

      - name: Contract tests
        run: node --test tests/*.test.mjs
